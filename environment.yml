name: panminer
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  # Build toolchain
  - rust>=1.70
  - cargo

  # Optional: GPU-accelerated clustering (falls back to built-in CPU if absent)
  - mmseqs2

  # Optional: Genome re-annotation
  - bakta

  # Optional: Pre-processing QC
  - checkm2

  # Optional: Multiple sequence alignment
  - mafft        # default alignment tool
  - clustalo     # Clustal Omega
  - prank        # PRANK alignment
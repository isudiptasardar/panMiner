name: panminer
channels:
  - conda-forge
  - bioconda
dependencies:
  # Core
  - python=3.10
  - mmseqs2
  - skani
  - mafft
  - clustalo
  - prank
  - clipkit

  # R (strictly pinned — R 4.3 is the last version with full Bioconductor compat)
  - r-base=4.3
  - r-panstripe

  # GWAS (compatible with Python 3.10)
  - pyseer
  - scoary2
  - spydrpick

  # Optional but safe-ish
  - ncbi-amrfinder

  # Risky packages — uncomment individually if needed; may cause solver conflicts
  # - checkm2       # large dep tree, often fails to solve
  # - bakta         # requires separate DB download (~6GB)
  # - ggcaller      # niche, limited platform support
  # - grapetree     # matplotlib version conflicts common

  - pip
  - pip:
      - bmge
      - biopython
[package]
name = "panminer"
version = "0.1.0"
edition = "2021"
authors = ["PanMiner Contributors"]
license = "MIT"
description = "A modern pangenome analysis tool with GPU and CPU support"
repository = "https://github.com/panminer/panminer"
readme = "README.md"
keywords = ["bioinformatics", "pangenome", "genomics", "gpu"]
categories = ["science", "command-line-utilities"]

[lib]
name = "panminer"
path = "src/lib.rs"

[[bin]]
name = "panminer"
path = "src/main.rs"

[dependencies]
# Parallelism
rayon = "1.10"
dashmap = "6.0"
crossbeam = "0.8"
parking_lot = "0.12"

# I/O
memmap2 = "0.9"
zstd = { version = "0.13", features = ["zdict_builder"] }
flate2 = "1.0"

# Data formats
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Parquet (optional)
parquet = { version = "52.0", optional = true }
arrow = { version = "52.0", optional = true }

# CLI
clap = { version = "4.5", features = ["derive"] }

# Serialization
bincode = "1.3"

# External tools
which = "6.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Threading
num_cpus = "1.16"

# Python bindings (optional)
pyo3 = { version = "0.22", features = ["extension-module"], optional = true }

# HTML templates (optional)
tera = { version = "1.20", optional = true }

[dev-dependencies]
criterion = "0.5"
tempfile = "3.10"
proptest = "1.4"

[features]
default = ["cpu"]
cpu = []
mmseqs = []
parquet = ["dep:parquet", "dep:arrow"]
python = ["dep:pyo3"]
viz = ["dep:tera"]
full = ["cpu", "mmseqs", "parquet", "viz"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
opt-level = 0

[profile.test]
opt-level = 2